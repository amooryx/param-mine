[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "param-mine"
version = "1.0.0"
description = "Authorized query-parameter change detection for HTTP endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Omar Khalid" }]
dependencies = []

[project.scripts]
param-mine = "param_mine:main"

[tool.setuptools]
py-modules = ["param_mine"]
